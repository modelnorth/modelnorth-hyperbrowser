[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelnorth-hyperbrowser"
version = "0.1.0"
description = "Ultrafast, local-first sovereign web agent engine combining sub-20ms decision models and multimodal vision sentries."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "ModelNorth Sovereign AI", email = "engineering@modelnorth.ai" }
]
dependencies = [
    "playwright>=1.49.0",
    "websockets>=12.0",
    "onnxruntime>=1.18.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
hyperbrowser = "modelnorth.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
