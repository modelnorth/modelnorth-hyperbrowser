name: ModelNorth HyperBrowser CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Test & Verify Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: Install Playwright Browsers
        run: |
          uv run playwright install --with-deps chromium

      - name: Verify In-V8 JavaScript Syntax
        run: |
          node --check modelnorth/core/snapshot.js
          node --check modelnorth/core/fastpath.js

      - name: Run Ruff Lint Check
        run: |
          uv run ruff check .

      - name: Run Automated Unit Tests
        run: |
          uv run pytest tests/ -v

      - name: Run Preflight Health Suite
        run: |
          uv run python scripts/preflight_check.py

  build-and-publish:
    name: Build Distribution Package
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build Wheel and Source Distribution
        run: |
          uv build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
